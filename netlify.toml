[build]
  publish = "public"
  functions = "netlify/functions"

# Assets are served with content-versioned query strings from the HTML
# (?v=...), so they can be cached aggressively. Bump the version in the
# HTML whenever a file under css/, js/, or images/ changes.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admission"
  to = "/admission.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
