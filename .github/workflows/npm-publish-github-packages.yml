name: Generate lockfiles (frontend + backend)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfiles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Clear npm cache-dir config (safe)
        run: |
          # remove deprecated setting if present and unset env vars
          npm config delete cache-dir || true
          unset NPM_CONFIG_CACHE_DIR || true
          unset npm_config_cache_dir || true
          npm config list

      - name: Install frontend deps and commit package-lock.json
        run: |
          set -e
          if [ -d frontend ]; then
            cd frontend
            # prefer ci if lockfile exists; otherwise install (creates package-lock.json)
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            cd ..
            # commit package-lock.json if created/changed
            git add frontend/package-lock.json || true
            if ! git diff --staged --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -m "chore(frontend): add/update package-lock.json (generated by workflow)"
              git push
            else
              echo "No frontend lockfile changes"
            fi
          else
            echo "No frontend directory"
          fi

      - name: Install backend deps and commit package-lock.json
        run: |
          set -e
          if [ -d backend ]; then
            cd backend
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            cd ..
            git add backend/package-lock.json || true
            if ! git diff --staged --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -m "chore(backend): add/update package-lock.json (generated by workflow)"
              git push
            else
              echo "No backend lockfile changes"
            fi
          else
            echo "No backend directory"
          fi
